name: ERP Client Build

on:
  push:
    branches:
      - master
      - main

  pull_request:
    branches:
      - master
      - main
  
  workflow_dispatch:

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
      
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

